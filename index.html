<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kartik Choice Center | Gariyaband</title>

<meta name="description" content="Kartik Choice Center Gariyaband - Online Government Services, PAN Card, Voter Card, Ayushman Card, PVC Card, Printing, Online Forms and Digital Services.">

<meta name="keywords" content="Kartik Choice Center, Gariyaband, CSC, Online Service, PAN Card, Voter Card, Ayushman Card, PVC Card, Printing">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f7f9fc;
    color:#172033;
    overflow-x:hidden;
}

:root{
    --navy:#071b3a;
    --navy2:#041329;
    --blue:#0866c6;
    --blue2:#0878bd;
    --cyan:#12a4e8;
    --gold:#ffc928;
    --gold2:#ffdf68;
    --green:#16c56b;
    --white:#ffffff;
    --muted:#68758a;
    --light:#f7f9fc;
    --border:#e5eaf2;
    --shadow:0 18px 50px rgba(7,27,58,.12);
    --shadow2:0 10px 30px rgba(7,27,58,.08);
}

a{
    text-decoration:none;
    color:inherit;
}

button,
input,
textarea{
    font:inherit;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:9999;
    background:rgba(7,27,58,.97);
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    backdrop-filter:blur(12px);
}

.header{
    max-width:1250px;
    margin:auto;
    padding:12px 24px;
    min-height:82px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-circle{
    width:58px;
    height:58px;
    border-radius:50%;
    background:white;
    border:3px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--navy);
    font-size:17px;
    font-weight:900;
    line-height:1;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.logo-circle small{
    display:block;
    font-size:8px;
    margin-top:3px;
}

.logo-text{
    font-size:21px;
    font-weight:900;
    color:white;
}

.logo-text span{
    color:var(--gold);
}

.logo-text small{
    display:block;
    color:#cbd9ed;
    font-size:10px;
    font-weight:500;
    margin-top:3px;
}

nav{
    display:flex;
    gap:6px;
    align-items:center;
}

nav a{
    color:white;
    font-size:14px;
    font-weight:700;
    padding:12px 15px;
    border-radius:22px;
    transition:.25s;
}

nav a:hover{
    background:rgba(255,255,255,.1);
    color:var(--gold);
}

nav .contact-nav{
    background:var(--gold);
    color:var(--navy);
}

.menu{
    display:none;
    color:white;
    font-size:30px;
    cursor:pointer;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;
    overflow:hidden;
    background:
    radial-gradient(circle at 85% 15%,rgba(18,164,232,.35),transparent 25%),
    radial-gradient(circle at 15% 85%,rgba(255,201,40,.12),transparent 25%),
    linear-gradient(135deg,#061630,#083b79 60%,#0878bd);
    color:white;
}

.hero:before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    right:-180px;
    bottom:-220px;
}

.hero:after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:50%;
    left:-180px;
    top:-150px;
}

.hero-inner{
    position:relative;
    z-index:2;
    max-width:1250px;
    margin:auto;
    min-height:690px;
    padding:85px 24px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:60px;
    align-items:center;
}

.badge{
    display:inline-flex;
    gap:8px;
    align-items:center;
    padding:11px 18px;
    border-radius:30px;
    background:rgba(255,201,40,.12);
    border:1px solid rgba(255,201,40,.35);
    color:var(--gold);
    font-size:14px;
    font-weight:900;
    margin-bottom:25px;
}

.hero h1{
    font-size:62px;
    line-height:1.08;
    letter-spacing:-2px;
    margin-bottom:23px;
}

.hero h1 span{
    color:var(--gold);
}

.hero-text{
    max-width:700px;
    color:#dbe9fb;
    font-size:18px;
    line-height:1.9;
    margin-bottom:32px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:54px;
    padding:14px 24px;
    border-radius:30px;
    font-size:15px;
    font-weight:900;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(0,0,0,.2);
}

.gold{
    background:var(--gold);
    color:var(--navy);
}

.green{
    background:var(--green);
    color:white;
}

.white{
    background:white;
    color:var(--navy);
}

.blue{
    background:var(--blue);
    color:white;
}

/* =========================================================
   HERO CARD
========================================================= */

.hero-visual{
    position:relative;
    display:flex;
    justify-content:center;
}

.glass{
    width:430px;
    padding:30px;
    border-radius:32px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 30px 70px rgba(0,0,0,.2);
    backdrop-filter:blur(12px);
}

.profile{
    text-align:center;
}

.profile-logo{
    width:125px;
    height:125px;
    margin:0 auto 15px;
    border-radius:50%;
    background:white;
    border:5px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--navy);
    font-size:23px;
    font-weight:900;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.profile-logo small{
    display:block;
    font-size:9px;
    margin-top:3px;
}

.profile h2{
    color:var(--gold);
    font-size:27px;
}

.profile p{
    font-size:14px;
    color:#dceaff;
    margin-top:5px;
}

.quick-services{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:25px;
}

.qs{
    padding:18px 8px;
    text-align:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    transition:.3s;
}

.qs:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.15);
}

.qs b{
    display:block;
    font-size:30px;
    margin-bottom:6px;
}

.qs span{
    font-size:13px;
    font-weight:700;
}

.float-card{
    position:absolute;
    right:-25px;
    bottom:-18px;
    background:white;
    color:var(--navy);
    padding:17px 20px;
    border-radius:18px;
    box-shadow:var(--shadow);
    font-size:14px;
    font-weight:900;
}

.float-card span{
    color:var(--green);
}

/* =========================================================
   STATS
========================================================= */

.stats{
    position:relative;
    z-index:4;
    margin-top:-40px;
    padding:0 20px;
}

.stats-inner{
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:24px;
    box-shadow:var(--shadow);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:25px;
}

.stat{
    text-align:center;
    border-right:1px solid var(--border);
}

.stat:last-child{
    border:0;
}

.stat strong{
    display:block;
    font-size:32px;
    color:var(--blue);
}

.stat span{
    font-size:13px;
    color:var(--muted);
    font-weight:700;
}

/* =========================================================
   COMMON
========================================================= */

.section{
    padding:100px 24px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.heading{
    text-align:center;
    max-width:780px;
    margin:0 auto 50px;
}

.kicker{
    font-size:13px;
    letter-spacing:2px;
    font-weight:900;
    color:var(--blue);
    text-transform:uppercase;
}

.heading h2{
    font-size:44px;
    line-height:1.2;
    color:var(--navy);
    margin:10px 0 14px;
}

.heading p{
    color:var(--muted);
    font-size:16px;
    line-height:1.7;
}

/* =========================================================
   SERVICES
========================================================= */

.services{
    background:#f7f9fc;
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.service{
    background:white;
    border:1px solid var(--border);
    border-radius:21px;
    padding:28px;
    box-shadow:0 8px 25px rgba(7,27,58,.05);
    transition:.3s;
    position:relative;
    overflow:hidden;
}

.service:after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,var(--gold),var(--cyan));
}

.service:hover{
    transform:translateY(-8px);
    box-shadow:var(--shadow);
}

.icon{
    width:65px;
    height:65px;
    border-radius:17px;
    background:#eaf5ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:33px;
    margin-bottom:18px;
}

.service h3{
    color:var(--navy);
    font-size:19px;
    margin-bottom:9px;
}

.service p{
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
}

.service a{
    display:inline-block;
    margin-top:16px;
    color:var(--blue);
    font-size:13px;
    font-weight:900;
}

.service-tag{
    display:inline-block;
    margin-top:12px;
    padding:5px 10px;
    border-radius:20px;
    background:#eafaf2;
    color:#07934c;
    font-size:11px;
    font-weight:800;
}

/* =========================================================
   FEATURE
========================================================= */

.feature{
    background:linear-gradient(135deg,#071b3a,#0a67b9);
    color:white;
}

.feature-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.feature h2{
    font-size:44px;
    line-height:1.25;
    margin:10px 0 20px;
}

.feature p{
    color:#d9e8f9;
    line-height:1.9;
    font-size:16px;
}

.feature-list{
    margin-top:28px;
    display:grid;
    gap:14px;
}

.feature-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 17px;
    border-radius:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    font-size:15px;
}

.feature-item b{
    width:38px;
    min-width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--gold);
    color:var(--navy);
    border-radius:50%;
}

.feature-card{
    background:white;
    color:var(--navy);
    padding:40px;
    border-radius:30px;
    box-shadow:0 25px 60px rgba(0,0,0,.2);
}

.feature-card h3{
    font-size:29px;
    margin-bottom:14px;
}

.feature-card p{
    color:var(--muted);
}

.feature-card .big{
    font-size:60px;
    font-weight:900;
    color:var(--blue);
    margin:18px 0;
}

/* =========================================================
   ABOUT
========================================================= */

.about{
    background:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.about-box{
    background:white;
    border:1px solid var(--border);
    border-radius:28px;
    padding:40px;
    box-shadow:var(--shadow);
}

.about-box h2{
    color:var(--navy);
    font-size:39px;
    margin-bottom:17px;
}

.about-box p{
    color:var(--muted);
    line-height:1.9;
    font-size:15px;
    margin-bottom:22px;
}

.about-points{
    display:grid;
    gap:14px;
}

.about-point{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:14px;
}

.about-point span{
    color:var(--green);
    font-size:21px;
}

.about-highlight{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.highlight{
    padding:30px;
    border-radius:22px;
    background:linear-gradient(135deg,#eaf5ff,#fff);
    border:1px solid var(--border);
}

.highlight strong{
    display:block;
    font-size:35px;
    color:var(--blue);
}

.highlight span{
    color:var(--muted);
    font-size:13px;
}

/* =========================================================
   PROCESS
========================================================= */

.process{
    background:#f7f9fc;
}

.process-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.process-card{
    background:white;
    padding:32px 22px;
    border-radius:22px;
    text-align:center;
    border:1px solid var(--border);
    transition:.3s;
}

.process-card:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow);
}

.number{
    width:62px;
    height:62px;
    margin:0 auto 17px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--navy);
    color:var(--gold);
    font-weight:900;
    font-size:22px;
}

.process-card h3{
    color:var(--navy);
    margin-bottom:9px;
    font-size:19px;
}

.process-card p{
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
}

/* =========================================================
   WHY US
========================================================= */

.why{
    background:white;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.why-card{
    padding:32px;
    border-radius:24px;
    border:1px solid var(--border);
    background:#fff;
    box-shadow:var(--shadow2);
    transition:.3s;
}

.why-card:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow);
}

.why-icon{
    width:62px;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    background:#eaf5ff;
    font-size:30px;
    margin-bottom:18px;
}

.why-card h3{
    color:var(--navy);
    font-size:20px;
    margin-bottom:10px;
}

.why-card p{
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
}

/* =========================================================
   CONTACT
========================================================= */

.contact{
    background:white;
}

.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.contact-card{
    padding:35px;
    border-radius:25px;
    border:1px solid var(--border);
    box-shadow:0 8px 25px rgba(7,27,58,.05);
}

.contact-card h3{
    color:var(--navy);
    font-size:28px;
    margin-bottom:20px;
}

.contact-item{
    display:flex;
    gap:14px;
    align-items:flex-start;
    padding:17px 0;
    border-bottom:1px solid var(--border);
}

.contact-item:last-child{
    border-bottom:0;
}

.contact-icon{
    min-width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:13px;
    background:#eaf5ff;
    font-size:22px;
}

.contact-item b{
    display:block;
    color:var(--navy);
    margin-bottom:5px;
    font-size:15px;
}

.contact-item span{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
}

.contact-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:22px;
}

.map-box{
    min-height:100%;
    background:linear-gradient(135deg,#071b3a,#0878bd);
    border-radius:25px;
    padding:40px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.map-box h3{
    font-size:34px;
    margin-bottom:17px;
}

.map-box p{
    color:#dceaff;
    line-height:1.8;
    margin-bottom:25px;
}

.address-box{
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    margin-bottom:20px;
}

/* =========================================================
   CTA
========================================================= */

.cta{
    padding:75px 24px;
    background:linear-gradient(135deg,#ffc928,#ffdf68);
}

.cta-box{
    max-width:950px;
    margin:auto;
    text-align:center;
}

.cta h2{
    color:var(--navy);
    font-size:42px;
    margin-bottom:14px;
}

.cta p{
    color:#4f4b35;
    margin-bottom:28px;
    font-size:16px;
    line-height:1.7;
}

   FOOTER

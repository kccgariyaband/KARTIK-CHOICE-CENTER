<title>Kartik Choice Center | KCC Gariyaband</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f5f8fc;
    color:#222;
    line-height:1.6;
}

a{
    text-decoration:none;
}

:root{
    --blue:#003b73;
    --blue2:#006fc4;
    --dark:#00264b;
    --gold:#ffc400;
    --green:#25d366;
    --white:#ffffff;
    --gray:#667085;
    --light:#eef7ff;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:var(--blue);
    box-shadow:0 4px 20px rgba(0,0,0,.2);
}

.header{
    max-width:1200px;
    margin:auto;
    min-height:70px;
    padding:8px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    background:#fff;
    border:2px solid var(--gold);
}

.logo-text{
    color:#fff;
    font-size:18px;
    font-weight:bold;
}

.logo-text span{
    color:var(--gold);
}

.logo-text small{
    display:block;
    color:#dcecff;
    font-size:9px;
    font-weight:normal;
}

nav{
    display:flex;
    align-items:center;
    gap:8px;
}

nav a{
    color:#fff;
    padding:10px 14px;
    border-radius:25px;
    font-size:14px;
    font-weight:bold;
}

nav a:hover{
    background:rgba(255,255,255,.12);
    color:var(--gold);
}

nav .contact-btn{
    background:var(--gold);
    color:var(--blue);
}

.menu{
    display:none;
    color:#fff;
    font-size:28px;
}

/* ================= HERO ================= */

.hero{
    background:
    linear-gradient(120deg,rgba(0,35,70,.97),rgba(0,100,175,.88)),
    url("https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1600");
    background-size:cover;
    background-position:center;
    color:#fff;
}

.hero-inner{
    max-width:1200px;
    min-height:600px;
    margin:auto;
    padding:70px 20px;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:45px;
    align-items:center;
}

.badge{
    display:inline-block;
    padding:8px 16px;
    border:1px solid rgba(255,196,0,.6);
    border-radius:30px;
    color:var(--gold);
    background:rgba(255,196,0,.12);
    font-weight:bold;
    margin-bottom:18px;
}

.hero h1{
    font-size:56px;
    line-height:1.15;
    margin-bottom:18px;
}

.hero h1 span{
    color:var(--gold);
}

.hero p{
    color:#e5f2ff;
    font-size:19px;
    max-width:650px;
    margin-bottom:28px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.btn{
    display:inline-block;
    padding:13px 22px;
    border-radius:30px;
    font-weight:bold;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-gold{
    background:var(--gold);
    color:var(--blue);
}

.btn-green{
    background:var(--green);
    color:#fff;
}

.btn-white{
    background:#fff;
    color:var(--blue);
}

/* HERO CARD */

.hero-card{
    background:rgba(255,255,255,.11);
    border:1px solid rgba(255,255,255,.3);
    border-radius:25px;
    padding:30px;
    backdrop-filter:blur(8px);
}

.hero-logo{
    text-align:center;
    padding-bottom:20px;
    border-bottom:1px solid rgba(255,255,255,.2);
}

.hero-logo img{
    width:95px;
    height:95px;
    object-fit:cover;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--gold);
}

.hero-logo h2{
    color:var(--gold);
    margin-top:10px;
}

.hero-logo p{
    font-size:14px;
    margin:5px 0 0;
}

.check-list{
    padding-top:18px;
}

.check-list div{
    padding:9px 0;
    color:#fff;
}

.check{
    color:var(--gold);
    font-weight:bold;
}

/* ================= STATS ================= */

.stats{
    background:#fff;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.stats-inner{
    max-width:1100px;
    margin:auto;
    padding:28px 20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.stat{
    text-align:center;
    border-right:1px solid #ddd;
}

.stat:last-child{
    border:none;
}

.stat strong{
    display:block;
    font-size:28px;
    color:var(--blue);
}

.stat span{
    font-size:13px;
    color:var(--gray);
}

/* ================= COMMON ================= */

.section{
    padding:80px 20px;
}

.container{
    max-width:1150px;
    margin:auto;
}

.heading{
    text-align:center;
    margin-bottom:45px;
}

.heading small{
    color:var(--blue2);
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:1px;
}

.heading h2{
    color:var(--blue);
    font-size:38px;
    margin:7px 0;
}

.heading p{
    color:var(--gray);
}

.services{
    background:#f5f8fc;
}

.service-grid{

    grid-template-columns

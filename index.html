<html lang="hi">
<head>

<title>Kartik Choice Center | Gariyaband</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
font-family:Arial,"Noto Sans Devanagari",sans-serif;
background:#f7f9fc;color:#172033;overflow-x:hidden
}
:root{
--navy:#071b3a;
--blue:#0866c6;
--cyan:#12a4e8;
--gold:#ffc928;
--green:#16c56b;
--white:#fff;
--muted:#68758a;
--border:#e5eaf2;
--shadow:0 18px 50px rgba(7,27,58,.12)
}
a{text-decoration:none;color:inherit}
button{font:inherit}

/* HEADER */
header{
position:sticky;top:0;z-index:9999;
background:rgba(7,27,58,.94);
backdrop-filter:blur(16px);
box-shadow:0 5px 25px rgba(0,0,0,.15)
}
.header{
max-width:1200px;margin:auto;padding:10px 20px;
min-height:72px;display:flex;align-items:center;
justify-content:space-between
}
.logo{display:flex;align-items:center;gap:11px}
.logo img{
width:50px;height:50px;border-radius:50%;
object-fit:cover;background:white;border:2px solid var(--gold)
}
.logo-text{font-size:18px;font-weight:900;color:white}
.logo-text span{color:var(--gold)}
.logo-text small{
display:block;color:#cbd9ed;font-size:9px;font-weight:500
}
nav{display:flex;gap:6px;align-items:center}
nav a{
color:white;font-size:13px;font-weight:700;
padding:10px 14px;border-radius:20px;transition:.25s
}
nav a:hover{background:rgba(255,255,255,.1);color:var(--gold)}
nav .contact-nav{background:var(--gold);color:var(--navy)}
.menu{display:none;color:white;font-size:28px;cursor:pointer}

.hero{

color:white
}
.hero:before{
content:"";position:absolute;width:500px;height:500px;
border:1px solid rgba(255,255,255,.08);border-radius:50%;
right:-180px;bottom:-220px
}
.hero-inner{
position:relative;z-index:2;max-width:1200px;margin:auto;
min-height:650px;padding:75px 20px;
display:grid;grid-template-columns:1.1fr .9fr;
gap:50px;align-items:center
}
.badge{
display:inline-flex;gap:8px;align-items:center;
padding:9px 16px;border-radius:30px;
background:rgba(255,201,40,.12);
border:1px solid rgba(255,201,40,.35);
color:var(--gold);font-size:12px;font-weight:900;
margin-bottom:22px
}
.hero h1{
font-size:60px;line-height:1.04;
letter-spacing:-2px;margin-bottom:20px
}
.hero h1 span{color:var(--gold)}
.hero-text{
max-width:650px;color:#dbe9fb;
font-size:18px;line-height:1.8;margin-bottom:28px
}
.buttons{display:flex;flex-wrap:wrap;gap:12px}
.btn{
display:inline-flex;align-items:center;justify-content:center;
min-height:48px;padding:12px 21px;border-radius:30px;
font-size:13px;font-weight:900;transition:.25s
}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.2)}
.gold{background:var(--gold);color:var(--navy)}
.green{background:var(--green);color:white}
.white{background:white;color:var(--navy)}
.outline{border:1px solid rgba(255,255,255,.3);color:white}

/* HERO VISUAL */
.hero-visual{
position:relative;display:flex;justify-content:center
}
.glass{

}
.profile{text-align:center}

border:4px solid var(--gold);margin-bottom:12px
}
.profile h2{color:var(--gold);font-size:25px}
.profile p{font-size:12px;color:#dceaff}
.quick-services{
display:grid;grid-template-columns:1fr 1fr;

}
.qs{

}
.qs b{display:block;font-size:25px;margin-bottom:4px}
.qs span{font-size:11px;font-weight:700}

/* FLOATING CARD */
.float-card{
position:absolute;right:-20px;bottom:-18px;
background:white;color:var(--navy);
padding:15px 18px;border-radius:18px;
box-shadow:var(--shadow);font-size:12px;font-weight:900
}
.float-card span{color:var(--green)}

/* STATS */
.stats{
position:relative;z-index:4;margin-top:-38px;padding:0 20px
}
.stats-inner{
max-width:1050px;margin:auto;background:white;
border-radius:24px;box-shadow:var(--shadow);
display:grid;grid-template-columns:repeat(4,1fr);
padding:20px
}
.stat{text-align:center;border-right:1px solid var(--border)}
.stat:last-child{border:0}
.stat strong{display:block;font-size:27px;color:var(--blue)}
.stat span{font-size:11px;color:var(--muted);font-weight:700}

/* COMMON */
.section{padding:90px 20px}
.container{max-width:1150px;margin:auto}
.heading{text-align:center;max-width:700px;margin:0 auto 45px}
.kicker{

color:var(--blue);text-transform:uppercase
}
.heading h2{
font-size:39px;line-height:1.2;color:var(--navy);
margin:8px 0 12px
}
.heading p{color:var(--muted);font-size:14px}

/* SERVICES */
.services{background:#f7f9fc}
.service-grid{
display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.service{
background:white;border:1px solid var(--border);
border-radius:21px;padding:23px;
box-shadow:0 8px 25px rgba(7,27,58,.05);
transition:.3s;position:relative;overflow:hidden
}
.service:after{
content:"";position:absolute;top:0;left:0;width:100%;height:4px;
background:linear-gradient(90deg,var(--gold),var(--cyan))
}
.service:hover{
transform:translateY(-8px);box-shadow:var(--shadow)
}
.icon{
width:57px;height:57px;border-radius:17px;
background:#eaf5ff;display:flex;align-items:center;
justify-content:center;font-size:29px;margin-bottom:15px
}
.service h3{color:var(--navy);font-size:17px;margin-bottom:7px}
.service p{color:var(--muted);font-size:12px;line-height:1.65}
.service a{
display:inline-block;margin-top:13px;color:var(--blue);
font-size:11px;font-weight:900
}

color:white
}

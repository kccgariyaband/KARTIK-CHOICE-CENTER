<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kartik Choice Center | KCC Gariyaband</title>

<meta name="description" content="Kartik Choice Center, Gariyaband - Online Government Services, PAN Card, Voter Card, Ayushman Card, PVC Card, Printing, Online Forms, Jobs & Education Updates.">

<meta name="theme-color" content="#071a3d">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
  overflow-x:hidden;
}

:root{
  --navy:#071a3d;
  --blue:#0b4ea2;
  --blue2:#1478d4;
  --sky:#eaf5ff;
  --gold:#ffc928;
  --gold2:#ffb300;
  --green:#19c463;
  --dark:#07152f;
  --text:#172033;
  --muted:#687386;
  --white:#ffffff;
  --border:#e4e9f1;
  --shadow:0 15px 40px rgba(15,39,78,.10);
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:9999;
  background:rgba(7,26,61,.96);
  backdrop-filter:blur(14px);
  box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.header{
  max-width:1200px;
  margin:auto;
  min-height:74px;
  padding:10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo img{
  width:50px;
  height:50px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid var(--gold);
  background:#fff;
}

.logo-text{
  color:white;
  font-size:18px;
  font-weight:800;
  letter-spacing:.3px;
}

.logo-text span{
  color:var(--gold);
}

.logo-text small{
  display:block;
  color:#cbdaf1;
  font-size:9px;
  font-weight:500;
  margin-top:1px;
}

nav{
  display:flex;
  align-items:center;
  gap:7px;
}

nav a{
  color:#fff;
  padding:10px 13px;
  font-size:13px;
  font-weight:700;
  border-radius:20px;
  transition:.25s;
}

nav a:hover{
  color:var(--gold);
  background:rgba(255,255,255,.08);
}

nav .nav-btn{
  background:var(--gold);
  color:var(--navy);
  padding:11px 18px;
}

nav .nav-btn:hover{
  background:#fff;
  color:var(--navy);
}

.menu{
  display:none;
  color:white;
  font-size:28px;
  cursor:pointer;
}

/* ================= HERO ================= */

.hero{
  position:relative;
  overflow:hidden;
  min-height:680px;
  background:
    radial-gradient(circle at 85% 20%,rgba(20,120,212,.35),transparent 28%),
    radial-gradient(circle at 10% 80%,rgba(255,201,40,.13),transparent 25%),
    linear-gradient(135deg,#061634 0%,#092e67 55%,#075ca9 100%);
  color:white;
}

.hero:before{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  right:-130px;
  bottom:-150px;
}

.hero:after{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  border:1px solid rgba(255,201,40,.13);
  border-radius:50%;
  left:-100px;
  top:80px;
}

.hero-inner{
  position:relative;
  z-index:2;
  max-width:1200px;
  min-height:680px;
  margin:auto;
  padding:70px 20px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:55px;
  align-items:center;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 15px;
  border-radius:30px;
  background:rgba(255,201,40,.12);
  border:1px solid rgba(255,201,40,.35);
  color:var(--gold);
  font-size:13px;
  font-weight:800;
  margin-bottom:22px;
}

.hero h1{
  font-size:58px;
  line-height:1.08;
  letter-spacing:-1px;
  margin-bottom:18px;
}

.hero h1 span{
  color:var(--gold);
}

.hero-sub{
  max-width:680px;
  color:#dceaff;
  font-size:18px;
  line-height:1.8;
  margin-bottom:28px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:48px;
  padding:12px 20px;
  border-radius:30px;
  font-weight:800;
  font-size:14px;
  transition:.25s;
  border:none;
}

.btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.btn-gold{
  background:var(--gold);
  color:var(--navy);
}

.btn-green{
  background:var(--green);
  color:white;
}

.btn-outline{
  border:1px solid rgba(255,255,255,.3);
  color:white;
  background:rgba(255,255,255,.06);
}

.btn-white{
  background:white;
  color:var(--navy);
}

/* HERO CARD */

.hero-card{
  position:relative;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.2);
  border-radius:30px;
  padding:28px;
  backdrop-filter:blur(15px);
  box-shadow:0 25px 60px rgba(0,0,0,.2);
}

.hero-card-top{
  text-align:center;
  padding-bottom:22px;
  border-bottom:1px solid rgba(255,255,255,.13);
}

.hero-logo{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  background:white;
  border:4px solid var(--gold);
  margin-bottom:12px;
}

.hero-card h2{
  color:var(--gold);
  font-size:25px;
}

.hero-card p{
  color:#d7e7fa;
  font-size:13px;
}

.service-mini{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:22px;
}

.mini{
  padding:14px 10px;
  background:rgba(255,255,255,.08);
  border-radius:15px;
  border:1px solid rgba(255,255,255,.08);
  text-align:center;
}

.mini-icon{
  font-size:25px;
  display:block;
  margin-bottom:4px;
}

.mini span{
  color:white;
  font-size:11px;
  font-weight:700;
}

/* ================= QUICK BAR ================= */

.quick{
  position:relative;
  z-index:5;
  margin-top:-45px;
}

.quick-inner{
  max-width:1100px;
  margin:auto;
  background:white;
  border-radius:22px;
  padding:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  box-shadow:var(--shadow);
}

.quick-item{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:10px;
  border-right:1px solid var(--border);
}

.quick-item:last-child{
  border-right:none;
}

.quick-item strong{
  display:block;
  color:var(--navy);
  font-size:14px;
}

.quick-item small{
  color:var(--muted);
  font-size:10px;
}

/* ================= COMMON ================= */

.section{
  padding:85px 20px;
}

.container{
  max-width:1150px;
  margin:auto;
}

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kartik Choice Center | Gariyaband</title>

<meta name="description" content="Kartik Choice Center Gariyaband - Online Government Services, PAN Card, Voter Card, Ayushman Card, PVC Card, Printing, Online Forms and Digital Services.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f5f8fc;
    color:#172033;
}

:root{
    --navy:#071b3a;
    --blue:#0878bd;
    --cyan:#12a4e8;
    --gold:#ffc928;
    --green:#18c86b;
    --white:#fff;
    --muted:#68758a;
    --border:#e3e9f2;
    --shadow:0 15px 40px rgba(7,27,58,.12);
}

a{
    text-decoration:none;
    color:inherit;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:9999;
    background:#071b3a;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

.header{
    max-width:1200px;
    min-height:75px;
    margin:auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-circle{
    width:53px;
    height:53px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--navy);
    font-weight:900;
    font-size:17px;
}

.logo-text{
    color:#fff;
    font-size:20px;
    font-weight:900;
}

.logo-text span{
    color:var(--gold);
}

.logo-text small{
    display:block;
    color:#cbd9ed;
    font-size:9px;
    margin-top:3px;
}

nav{
    display:flex;
    gap:5px;
    align-items:center;
}

nav a{
    color:#fff;
    padding:10px 14px;
    border-radius:25px;
    font-size:14px;
    font-weight:700;
}

nav a:hover{
    background:rgba(255,255,255,.1);
    color:var(--gold);
}

.contact-nav{
    background:var(--gold);
    color:var(--navy)!important;
}

.menu{
    display:none;
    color:white;
    font-size:30px;
    cursor:pointer;
}

/* HERO */

.hero{
    color:white;
    background:
    radial-gradient(circle at 85% 15%,rgba(18,164,232,.35),transparent 25%),
    linear-gradient(135deg,#061630,#083b79 60%,#0878bd);
}

.hero-inner{
    max-width:1200px;
    min-height:610px;
    margin:auto;
    padding:70px 20px;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:50px;
    align-items:center;
}

.badge{
    display:inline-block;
    padding:10px 18px;
    border-radius:30px;
    color:var(--gold);
    background:rgba(255,201,40,.12);
    border:1px solid rgba(255,201,40,.35);
    font-weight:900;
    margin-bottom:20px;
}

.hero h1{
    font-size:55px;
    line-height:1.1;
    margin-bottom:20px;
}

.hero h1 span{
    color:var(--gold);
}

.hero-text{
    color:#dbe9fb;
    font-size:17px;
    line-height:1.8;
    margin-bottom:28px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.btn{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    min-height:50px;
    padding:13px 22px;
    border-radius:30px;
    font-weight:900;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.gold{
    background:var(--gold);
    color:var(--navy);
}

.green{
    background:var(--green);
    color:#fff;
}

.white{
    background:#fff;
    color:var(--navy);
}

/* HERO CARD */

.glass{
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(10px);
}

.profile{
    text-align:center;
}

.profile-logo{
    width:115px;
    height:115px;
    margin:auto;
    border-radius:50%;
    background:#fff;
    border:5px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--navy);
    font-size:25px;
    font-weight:900;
}

.profile h2{
    color:var(--gold);
    margin-top:15px;
}

.profile p{
    color:#dceaff;
    margin-top:6px;
}

.quick-services{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:25px;
}

.qs{
    padding:15px;
    border-radius:16px;
    text-align:center;
    background:rgba(255,255,255,.09);
}

.qs b{
    display:block;
    font-size:28px;
    margin-bottom:5px;
}

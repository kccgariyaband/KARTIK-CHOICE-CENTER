<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kartik Choice Center | Gariyaband</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f4f8ff;
    color:#222;
}

/* HEADER */
header{
    background:#003366;
    color:white;
    padding:12px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 15px rgba(0,0,0,.25);
}

.logo-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-box img{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #FFD700;
}

.logo-text{
    color:#FFD700;
    font-size:23px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#FFD700;
}

/* HERO */
.hero{
    min-height:88vh;
    background:
    linear-gradient(rgba(0,51,102,.88),rgba(0,51,102,.82)),
    url('https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1600');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:40px 20px;
}

.hero-content{
    max-width:900px;
}

.badge{
    display:inline-block;
    background:#FFD700;
    color:#003366;
    padding:9px 18px;
    border-radius:25px;
    font-weight:bold;
    margin-bottom:20px;
}

.hero h1{
    font-size:52px;
    margin-bottom:18px;
}

.hero h1 span{
    color:#FFD700;
}

.hero p{
    font-size:22px;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.call-btn{
    background:#FFD700;
    color:#003366;
}

.whatsapp-btn{
    background:#25D366;
    color:white;
}

.service-btn{
    background:white;
    color:#003366;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 7px 15px rgba(0,0,0,.25);
}

/* COMMON SECTION */
section{
    padding:70px 7%;
}

.section-title{
    text-align:center;
    color:#003366;
    font-size:36px;
    margin-bottom:12px;
}

.section-subtitle{
    text-align:center;
    color:#666;
    margin-bottom:40px;
}

/* SERVICES */
.services{
    background:white;
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:22px;
}

.card{
    padding:28px 20px;
    border-radius:18px;
    text-align:center;
    background:#f8fbff;
    box-shadow:0 5px 18px rgba(0,0,0,.10);
    border-top:5px solid #003366;
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 10px 25px rgba(0,0,0,.16);
}

.card-icon{
    font-size:42px;
    margin-bottom:15px;
}

.card h3{
    color:#003366;
    margin-bottom:10px;
    font-size:21px;
}

.card p{
    color:#666;
    line-height:1.5;
}

/* ABOUT */
.about{
    background:#eef5ff;
}

.about-box{
    max-width:900px;
    margin:auto;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
    text-align:center;
}

.about-box h3{
    color:#003366;
    font-size:28px;
    margin-bottom:15px;
}

.about-box p{
    line-height:1.8;
    color:#555;
}

/* UPDATES */
.updates{
    background:white;
}

.update-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.update-card{
    padding:25px;
    border-radius:15px;
    background:#fff8e1;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
}

.update-card h3{
    color:#003366;
    margin-bottom:10px;
}

.update-card p{
    color:#555;
    line-height:1.5;
}

/* CONTACT */
.contact{
    background:#003366;
    color:white;
    text-align:center;
}

.contact .section-title{
    color:#FFD700;
}

.contact-info{
    max-width:700px;
    margin:auto;
    line-height:2;
    font-size:18px;
}

.contact-buttons{
    margin-top:25px;
}

/* FOOTER */
footer{
    background:#002244;
    color:white;
    text-align:center;
    padding:20px;
    font-size:14px;
}

/* WHATSAPP FLOATING BUTTON */
.whatsapp-float{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#25D366;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    text-decoration:none;
    box-shadow:0 5px 18px rgba(0,0,0,.3);
    z-index:9999;
}

/* MOBILE */
@media(max-width:768px){

    header{
        padding:10px 4%;
    }

    .logo-text{
        font-size:17px;
    }

    .logo-box img{
        width:45px;
        height:45px;
    }

    nav{
        display:none;
    }

    .hero{
        min-height:82vh;
    }

    .hero h1{
        font-size:34px;
    }

    .hero p{
        font-size:18px;
    }

    section{
        padding:55px 5%;
    }

    .section-title{
        font-size:30px;
    }

    .about-box{
        padding:25px 18px;
    }
}
</style>
</head>

<body>

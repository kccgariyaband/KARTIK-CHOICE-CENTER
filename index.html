*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:80px;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f8fc;
    color:#222;
    overflow-x:hidden;
}

:root{
    --blue:#003b73;
    --blue2:#0066b3;
    --dark:#00254a;
    --gold:#ffc400;
    --light:#eef6ff;
    --green:#25d366;
    --white:#fff;
    --gray:#667085;
}

a{
    text-decoration:none;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:9999;
    background:rgba(0,59,115,.98);
    box-shadow:0 4px 20px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-area img{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--gold);
}

.logo-name{
    color:white;
    font-size:20px;
    font-weight:bold;
}

.logo-name span{
    color:var(--gold);
}

.logo-name small{
    display:block;
    font-size:9px;
    font-weight:normal;
    color:#dcecff;
    margin-top:3px;
}

nav{
    display:flex;
    align-items:center;
    gap:22px;
}

nav a{
    color:white;
    font-size:14px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:var(--gold);
}

.nav-contact{
    background:var(--gold);
    color:var(--blue)!important;
    padding:10px 17px;
    border-radius:25px;
}

.menu{
    display:none;
    color:white;
    font-size:29px;
    cursor:pointer;
    user-select:none;
}

    display:flex;
    align-items:center;
    overflow:hidden;
    background:

    url("https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1600");
    background-size:cover;
    background-position:center;
}

.hero-inner{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:70px 20px;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:40px;
    align-items:center;
}

.hero-content{
    color:white;
}

.hero-tag{
    display:inline-block;
    background:rgba(255,196,0,.15);
    border:1px solid rgba(255,196,0,.5);
    color:var(--gold);
    padding:9px 17px;
    border-radius:30px;
    font-weight:bold;
    margin-bottom:20px;
}

.hero h1{
    font-size:56px;
    line-height:1.12;
    margin-bottom:20px;
}

.hero h1 span{
    color:var(--gold);
}

.hero-text{
    font-size:20px;
    line-height:1.7;
    color:#e6f2ff;
    margin-bottom:28px;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

    align-items:center;
    justify-content:center;
    padding:14px 23px;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}
